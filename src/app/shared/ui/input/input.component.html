<div class="mb-5">
  @if (label()) {
    <label class="font-bold mb-3 block text-gray-700">
      {{ label() }}
    </label>
  }

  <div class="relative">
    <input
      [type]="!showPassword ? type() : 'text'"
      [placeholder]="placeholder()"
      [formControl]="control()"
      class="w-full rounded-md border bg-white py-2 px-3 font-medium text-gray-500 outline-none focus:border-blue-700 focus:shadow-md"
      [class.border-red-500]="control().invalid && control().touched"
      [class.border-gray-200]="!(control().invalid && control().touched)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (input)="onInput()"
    />

    @if(type() === 'password') {
      <div class="absolute right-0 top-1/2 -translate-1/2 cursor-pointer">
        @if (!showPassword){
          <icon-eye (click)="changeTypePassword()"/>
        }
    
        @if (showPassword){
          <icon-eye-slash (click)="changeTypePassword()"/>
        }
      </div>
    }
  </div>

  @if (control().invalid && control().touched) {
    <form-error-label [control]="control()" />
  }
</div>
