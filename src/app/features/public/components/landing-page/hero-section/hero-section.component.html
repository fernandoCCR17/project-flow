<main class="flex flex-col justify-center lg:grid lg:grid-cols-2 items-center py-4 px-6">
    <div>
        <app-message 
            severity="info" 
            class="mt-5 mb-10 !text-xs"
            [classes]="'md:!rounded-full !text-xs'"
        >
            <span class="font-bold">New:</span> Multi-tenant management for Enterprise
        </app-message>

        <h1 class="text-4xl text-center font-bold mb-5 md:text-7xl md:text-left">
            Manage projects across your <span class="text-blue-700">entire organization</span>
        </h1>
        <p class="text-center text-neutral-600 md:text-xl md:text-left">The all-in-one workspace for modern teams. Streamline workflows, scale with multi-tenancy, and hit every deadline with ease.</p>

        <div class="flex flex-col my-10 gap-5 md:flex-row">
            <button 
                type="button" 
                class="border border-blue-900 bg-blue-700 hover:bg-blue-900 cursor-pointer py-3 px-10 rounded-lg text-white font-bold transition md:w-fit"
                routerLink="/auth"
            >
                Get Started Free
            </button>
            <button 
                type="button" 
                class="border border-neutral-300 hover:bg-blue-700 hover:border-blue-700 font-bold cursor-pointer hover:text-white rounded-lg py-3 px-10 md:w-fit"
            >
                View Demo
            </button>
        </div>
    </div>

    <div class="w-full flex justify-center items-center p-5">
        <div class="w-4/5 h-36 bg-blue-700"></div>
    </div>
</main>
