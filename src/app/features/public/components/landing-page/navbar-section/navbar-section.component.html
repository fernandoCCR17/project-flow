<nav class="relative top-0 w-full z-50 glass-nav transition-all duration-300" id="navbar">

            <div class="w-8 h-8 bg-blue-700 text-black font-bold flex items-center justify-center rounded group-hover:bg-blue-900 transition">
                <icon-bolt 
                    [strokeColor]="'#fff'"
                />
            </div>
            <div class="text-xl font-bold tracking-tight">Project<span class="text-gray-400">Flow</span></div>
        </div>

        <!-- Menu Desktop -->
        <div class="hidden md:flex gap-8 text-sm uppercase font-bold">

        </div>

        <div class="flex items-center gap-4">

            <button

    [isOpen]="showMenu()"
