<div 
  class="md:hidden fixed inset-0 z-50 transition-all duration-300 ease-in-out"
  [ngClass]="{
    'opacity-100 pointer-events-auto': isOpen(),
    'opacity-0 pointer-events-none': !isOpen()
  }"
>

  <!-- Overlay -->
  <div 
    class="absolute inset-0 bg-black/40 backdrop-blur-sm"
    (click)="close()"
  ></div>

  <!-- Panel -->
  <div 
    class="top-0 left-0 h-full w-4/5 max-w-sm bg-blue-700 
           transform transition-transform duration-300 ease-in-out
           flex flex-col gap-8 p-10 relative"
    [ngClass]="{
      'translate-x-0': isOpen(),
      '-translate-x-full': !isOpen()
    }"
  >

    <icon-x-mark 
      class="absolute right-6 top-6 cursor-pointer text-white"
      (click)="close()"
    />

    <navbar-anchors
      (closeMenu)="close()"
    />
  </div>
</div>
