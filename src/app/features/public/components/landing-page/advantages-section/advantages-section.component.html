<h2 class="flex flex-col text-center font-bold text-2xl md:text-3xl lg:text-4xl mb-10"><span class="text-sm text-blue-700 font-semibold">EVERYTHING YOU NEED</span>Built for Scale and Collaboration</h2>

<div class="flex flex-col gap-5 md:grid md:grid-cols-2 lg:grid-cols-3 md:gap-10 mb-10">
    @for (item of itemsCards(); track $index) {
        <app-card [clases]="'w-full h-full p-6 !shadow-xl'">
            <div cardTitle>
                <div class="px-3 py-2 rounded-sm bg-blue-200 w-fit flex justify-center items-center">
                    <i class="pi text-blue-700" [ngClass]="item.icon"></i>
                </div>
                <h3 class="font-semibold text-black my-2 md:text-xl">{{item.title}}</h3>
            </div>

            <p cardBody class="text-sm text-gray-500 md:text-base text-justify">
                {{item.description}}
            </p>
        </app-card>
    }
</div>
